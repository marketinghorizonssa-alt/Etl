name: Build Etlaala

on:
  push:
    branches: [main]
    paths:
      - 'build.mjs'
      - 'enhance.mjs'
      - 'legacy-footer.mjs'
      - 'footer-layout.mjs'
      - 'package.json'
      - 'public/**'
      - '.github/workflows/build-etlaala.yml'
  workflow_dispatch:

env:
  NODE_VERSION: '22'

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build static site
        run: npm run build

      - name: Verify generated site
        shell: bash
        run: |
          test -f dist/index.html
          test -f dist/sitemap.xml
          test -f dist/robots.txt
          test -f dist/llms.txt
          ! grep -R '<link rel="canonical" href="https://etlaala.com' dist
          grep -R 'https://etlaala.net' dist/index.html
          grep -R 'GTM-MSF3NWFN' dist/index.html
          grep -R 'whatsapp_click' dist/assets/main.js
          grep -R 'call_click' dist/assets/main.js
          grep -R 'form_submit' dist/assets/main.js
          grep -R 'class="dest-menu"' dist/index.html
          grep -R 'class="float-btn float-wa"' dist/index.html
          grep -R 'class="float-btn float-call"' dist/index.html
          grep -R 'class="legacy-footer"' dist/index.html
          grep -R 'سياسة الخصوصية - Privacy Policy' dist/index.html
          grep -R 'الشروط و الاحكام - terms and Conditions' dist/index.html
          grep -R '©2025, اطلالة' dist/index.html
          grep -R 'legacy-footer-layout-polish-v2' dist/assets/styles.css
          for p in europe georgia georgia-2 malaysia malaysia-2 maldives maldives-2 thailand thailand-2 turkiye turkey-2 bosnia-and-herzegovina; do test -f "dist/$p/index.html"; done

      - name: Package deploy artifact
        shell: bash
        run: |
          cd dist
          zip -r ../etlaala-net-dist.zip .

      - name: Upload deploy artifact
        uses: actions/upload-artifact@v4
        with:
          name: etlaala-net-dist
          path: etlaala-net-dist.zip
          if-no-files-found: error
          retention-days: 7
