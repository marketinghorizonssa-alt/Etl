name: Build Etlaala

on:
  push:
    branches: [main]
    paths:
      - '*.mjs'
      - 'data/**'
      - 'package.json'
      - 'public/**'
      - '.github/workflows/build-etlaala.yml'
  workflow_dispatch:

concurrency:
  group: build-etlaala
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build static site
        run: npm run build

      - name: Verify generated site
        shell: bash
        run: |
          test -f dist/index.html
          test -f dist/sitemap.xml
          test -f dist/robots.txt
          test -f dist/llms.txt
          ! grep -R '<link rel="canonical" href="https://etlaala.com' dist
          grep -R 'https://etlaala.net' dist/index.html
          grep -R 'GTM-MSF3NWFN' dist/index.html
          grep -R 'whatsapp_click' dist/assets/main.js
          grep -R 'call_click' dist/assets/main.js
          grep -R 'form_submit' dist/assets/main.js
          grep -R 'class="navlinks navlinks-unified"' dist/index.html
          grep -R 'class="float-btn float-wa"' dist/index.html
          grep -R 'class="float-btn float-call"' dist/index.html
          grep -R 'class="compact-footer"' dist/index.html
          grep -R '73104738' dist/index.html
          grep -R '4031293290' dist/index.html
          grep -R '7037638678' dist/index.html
          grep -R 'سياسة الخصوصية' dist/index.html
          grep -R 'الشروط والأحكام' dist/index.html
          grep -R 'id="articles"' dist/index.html
          test -f dist/articles/index.html
          grep -R 'seo-articles-curated-v1' dist/assets/styles.css
          test -s data/articles.json
          for p in europe georgia malaysia maldives thailand turkiye bosnia-and-herzegovina; do test -f "dist/$p/index.html"; done
          for p in georgia-2 malaysia-2 maldives-2 thailand-2 turkey-2; do test ! -e "dist/$p"; done
          grep -R 'data-premium-destination="turkiye"' dist/turkiye/index.html
          for p in europe georgia malaysia maldives thailand bosnia-and-herzegovina; do grep -R 'data-premium-destination=' "dist/$p/index.html"; grep -R 'id="destination-quote-form"' "dist/$p/index.html"; done
          grep -R 'destination-premium-rollout-v1' dist/assets/styles.css
          find dist/assets/media -type f -print -quit | grep -q .
          ! grep -R 'https://etlaala.com/wp-content/uploads' dist

      - name: Package deploy artifact
        shell: bash
        run: |
          cd dist
          zip -r ../etlaala-net-dist.zip .

      - name: Upload deploy artifact
        uses: actions/upload-artifact@v4
        with:
          name: etlaala-net-dist
          path: etlaala-net-dist.zip
          if-no-files-found: error
          retention-days: 7
