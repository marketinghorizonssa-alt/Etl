name: Preview Etlaala on GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - '*.mjs'
      - 'data/**'
      - 'package.json'
      - 'public/**'
      - '.github/workflows/preview-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build site
        run: npm run build

      - name: Remove Google tracking from GitHub Pages preview
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          function walk(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const p = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(p);
              else if (entry.isFile() && p.endsWith('.html')) scrub(p);
            }
          }

          function scrub(file) {
            let html = fs.readFileSync(file, 'utf8');

            // Remove GTM blocks generated by the production build.
            html = html.replace(/<!-- Google Tag Manager -->[\s\S]*?<!-- End Google Tag Manager -->/gi, '');

            // Remove the GTM noscript iframe.
            html = html.replace(/<noscript>\s*<iframe[^>]+googletagmanager\.com\/ns\.html[^>]*><\/iframe>\s*<\/noscript>/gi, '');

            // Remove direct gtag.js loader scripts if one is ever added later.
            html = html.replace(/<script[^>]+src=["'][^"']*googletagmanager\.com\/gtag\/js[^"']*["'][^>]*><\/script>/gi, '');

            // Remove standard inline gtag bootstrap/config blocks if one is ever added later.
            html = html.replace(/<script>\s*window\.dataLayer\s*=\s*window\.dataLayer\s*\|\|\s*\[\];[\s\S]*?gtag\(['"]config['"][\s\S]*?<\/script>/gi, '');

            fs.writeFileSync(file, html);
          }

          walk('dist');
          NODE

          # Fail the preview deployment if any Google tag/container IDs remain.
          if grep -R -E 'GTM-[A-Z0-9]+|AW-[0-9]+|googletagmanager\.com/(gtm|gtag|ns\.html)' dist --include='*.html'; then
            echo 'Google tracking is still present in the GitHub Pages preview.' >&2
            exit 1
          fi

      - name: Patch root-relative links for GitHub Pages preview
        shell: bash
        run: |
          find dist -type f -name '*.html' -print0 | xargs -0 sed -i \
            -e 's#href="/#href="/Etl/#g' \
            -e 's#src="/#src="/Etl/#g'

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
