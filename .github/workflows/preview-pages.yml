name: Preview Etlaala on GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'build.mjs'
      - 'package.json'
      - 'public/**'
      - '.github/workflows/preview-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build site
        run: npm run build

      - name: Patch root-relative links for GitHub Pages preview
        shell: bash
        run: |
          find dist -type f -name '*.html' -print0 | xargs -0 sed -i \
            -e 's#href="/#href="/Etl/#g' \
            -e 's#src="/#src="/Etl/#g'

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
