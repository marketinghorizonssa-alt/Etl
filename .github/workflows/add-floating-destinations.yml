name: Add floating contacts and destinations menu

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-floating-destinations.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch site chrome
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('build.mjs')
          s = p.read_text()

          start = s.index('function header(){')
          end = s.index('\nfunction footer(){', start)
          new_header = r'''function destinationMenu(){const links=[["/georgia/","جورجيا"],["/georgia-2/","عروض جورجيا"],["/malaysia/","ماليزيا"],["/malaysia-2/","عروض ماليزيا"],["/maldives/","المالديف"],["/maldives-2/","عروض المالديف"],["/thailand/","تايلاند"],["/thailand-2/","عروض تايلاند"],["/turkiye/","تركيا"],["/turkey-2/","عروض تركيا"],["/bosnia-and-herzegovina/","البوسنة والهرسك"],["/europe/","أوروبا"]];return `<details class="dest-menu"><summary aria-label="فتح قائمة الوجهات"><span>الوجهات</span><span class="dest-chevron" aria-hidden="true">⌄</span></summary><div class="dest-dropdown" role="menu">${links.map(([url,label])=>`<a role="menuitem" href="${url}">${label}</a>`).join('')}</div></details>`;}
function header(){return `<div class="brand-strip"><div class="container"><span>إطلالة عالم تستحق أن تعيشه</span><div><a data-track="call" href="tel:${PHONE_TEL}">☎ ${PHONE_DISPLAY}</a><span class="dot">•</span><a data-track="whatsapp" href="${wa('مرحباً إطلالة، أريد الاستفسار عن عروض السفر')}">واتساب</a></div></div></div><header class="site-header"><div class="container nav"><a class="brand" href="/" aria-label="إطلالة للسفر والسياحة - الرئيسية"><img src="${LOGO}" width="220" height="74" alt="إطلالة للسفر والسياحة" fetchpriority="high"><span class="brand-fallback">إطلالة</span></a>${destinationMenu()}<nav class="navlinks" aria-label="التنقل الرئيسي"><a href="/">الرئيسية</a><a href="/#destinations">عروض سياحية 2026</a><a href="/#services">الخدمات</a><a href="/#why">لماذا إطلالة؟</a><a href="/#contact">تواصل معنا</a></nav><a class="header-cta" data-track="whatsapp" href="${wa('مرحباً إطلالة، أريد حجز رحلة')}">احجز الآن</a></div></header>`;}'''
          s = s[:start] + new_header + s[end:]

          start = s.index('function footer(){')
          end = s.index('\nfunction quickForm(', start)
          new_footer = r'''function footer(){return `<footer class="footer" id="contact"><div class="container footer-grid"><div><img class="footer-logo" src="${LOGO}" width="210" height="70" loading="lazy" alt="إطلالة للسفر والسياحة"><p>إطلالة عالم تستحق أن تعيشه. برامج سياحية وحجوزات مصممة للمسافر من السعودية إلى أبرز الوجهات العالمية.</p></div><div><h3>روابط سريعة</h3><a href="/#destinations">الوجهات والعروض</a><a href="/#services">خدمات إطلالة</a><a href="/#why">لماذا إطلالة؟</a></div><div><h3>تواصل معنا</h3><a data-track="call" href="tel:${PHONE_TEL}">${PHONE_DISPLAY}</a><a data-track="whatsapp" href="${wa('مرحباً إطلالة، أريد الاستفسار')}">واتساب</a><span>ترخيص وزارة السياحة: 73104738</span></div><div><h3>وجهات مميزة</h3><a href="/georgia/">جورجيا</a><a href="/malaysia/">ماليزيا</a><a href="/maldives/">المالديف</a><a href="/turkiye/">تركيا</a><a href="/europe/">أوروبا</a></div></div><div class="container copyright">© ${new Date().getFullYear()} إطلالة للسفر والسياحة. جميع الحقوق محفوظة.</div></footer><div class="floating-contact" aria-label="تواصل سريع"><a class="float-btn float-wa" data-track="whatsapp" href="${wa('مرحباً إطلالة، أريد عرضاً سياحياً')}" aria-label="تواصل عبر واتساب" title="واتساب"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a8 8 0 0 0-6.9 12.05L4 20l5.1-1.06A8 8 0 1 0 12 3Zm0 2a6 6 0 1 1-2.25 11.56l-.3-.12-2.8.58.6-2.7-.15-.32A6 6 0 0 1 12 5Zm-2.15 3.2c-.2 0-.4.02-.57.2-.17.18-.65.63-.65 1.54 0 .9.66 1.78.75 1.9.1.12 1.3 1.98 3.14 2.78 1.55.67 1.87.54 2.2.5.34-.06 1.1-.45 1.26-.89.15-.44.15-.82.1-.9-.04-.08-.17-.12-.36-.22-.2-.1-1.1-.54-1.27-.6-.17-.06-.3-.1-.42.1-.13.2-.48.6-.59.73-.11.13-.22.15-.41.05-.2-.1-.82-.3-1.56-.96a5.85 5.85 0 0 1-1.08-1.34c-.11-.2-.01-.3.08-.4.08-.08.2-.22.29-.33.1-.11.13-.2.2-.32.06-.13.03-.24-.02-.34-.05-.1-.43-1.04-.59-1.42-.15-.37-.31-.38-.5-.38Z"/></svg><span class="float-label">واتساب</span></a><a class="float-btn float-call" data-track="call" href="tel:${PHONE_TEL}" aria-label="اتصل بإطلالة" title="اتصال"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7.1 3.5 9.4 8a1.4 1.4 0 0 1-.28 1.62l-1.2 1.18a14.2 14.2 0 0 0 5.28 5.28l1.18-1.2A1.4 1.4 0 0 1 16 14.6l4.5 2.3a1.4 1.4 0 0 1 .72 1.55l-.35 1.72A2.3 2.3 0 0 1 18.6 22C9.44 22 2 14.56 2 5.4a2.3 2.3 0 0 1 1.83-2.27l1.72-.35a1.4 1.4 0 0 1 1.55.72Z"/></svg><span class="float-label">اتصال</span></a></div>`;}'''
          s = s[:start] + new_footer + s[end:]
          p.write_text(s)

          css = Path('public/styles.css')
          c = css.read_text()
          marker = '/* floating-contact-and-destinations-v1 */'
          block = r'''
/* floating-contact-and-destinations-v1 */
.dest-menu{position:relative;z-index:90;flex:0 0 auto}.dest-menu summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:7px;padding:10px 14px;border-radius:12px;font-weight:800;color:#fff;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.18);transition:.2s ease}.dest-menu summary::-webkit-details-marker{display:none}.dest-menu summary:hover,.dest-menu[open] summary{background:rgba(255,255,255,.18)}.dest-chevron{font-size:1.05em;line-height:1;transition:transform .2s ease}.dest-menu[open] .dest-chevron{transform:rotate(180deg)}.dest-dropdown{position:absolute;top:calc(100% + 12px);right:0;width:520px;max-width:78vw;padding:12px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;background:#fff;border:1px solid rgba(17,32,82,.1);border-radius:18px;box-shadow:0 20px 60px rgba(8,19,58,.22)}.dest-dropdown:before{content:"";position:absolute;top:-7px;right:28px;width:14px;height:14px;background:#fff;transform:rotate(45deg);border-left:1px solid rgba(17,32,82,.08);border-top:1px solid rgba(17,32,82,.08)}.dest-dropdown a{position:relative;z-index:1;padding:11px 12px;border-radius:11px;color:#16214d;font-weight:750;background:#f8f9ff;border:1px solid transparent;transition:.18s ease}.dest-dropdown a:hover,.dest-dropdown a:focus-visible{background:#eef0ff;border-color:#dfe3ff;color:#5526b7;transform:translateY(-1px)}
.mobile-bar{display:none!important}.floating-contact{display:contents}.float-btn{position:fixed;bottom:max(22px,env(safe-area-inset-bottom));z-index:120;width:62px;height:62px;border-radius:50%;display:grid;place-items:center;box-shadow:0 12px 30px rgba(0,0,0,.22);transition:transform .2s ease,box-shadow .2s ease}.float-btn:hover{transform:translateY(-4px) scale(1.03);box-shadow:0 16px 36px rgba(0,0,0,.28)}.float-btn svg{width:29px;height:29px;fill:#fff}.float-wa{right:22px;background:#25D366}.float-call{left:22px;background:linear-gradient(135deg,#1335AE,#6D22B7 58%,#F15A29)}.float-label{position:absolute;top:50%;transform:translateY(-50%);padding:7px 10px;background:#141a30;color:#fff;border-radius:9px;font-size:.85rem;font-weight:800;white-space:nowrap;opacity:0;pointer-events:none;transition:.18s ease}.float-wa .float-label{right:72px}.float-call .float-label{left:72px}.float-btn:hover .float-label,.float-btn:focus-visible .float-label{opacity:1}
@media(max-width:900px){.nav{gap:10px}.navlinks{display:none!important}.header-cta{display:none!important}.brand img{width:150px;height:auto}.dest-menu{margin-inline-start:auto}.dest-menu summary{padding:9px 11px}.dest-dropdown{position:fixed;top:112px;right:16px;left:16px;width:auto;max-width:none;max-height:64vh;overflow:auto;grid-template-columns:repeat(2,minmax(0,1fr))}.dest-dropdown:before{display:none}.float-btn{width:56px;height:56px;bottom:max(16px,env(safe-area-inset-bottom))}.float-btn svg{width:26px;height:26px}.float-wa{right:14px}.float-call{left:14px}.float-label{display:none}}
@media(max-width:520px){.dest-dropdown{grid-template-columns:1fr;top:104px}.dest-menu summary span:first-child{font-size:.9rem}}
'''
          if marker not in c:
              css.write_text(c + block)
          PY

      - name: Verify patch
        shell: bash
        run: |
          grep -q 'function destinationMenu' build.mjs
          grep -q 'class="float-btn float-wa"' build.mjs
          grep -q 'class="float-btn float-call"' build.mjs
          grep -q 'floating-contact-and-destinations-v1' public/styles.css
          npm run build

      - name: Commit changes
        shell: bash
        run: |
          git config user.name 'Etlaala Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add build.mjs public/styles.css
          git commit -m 'Add destination dropdown and floating WhatsApp/call buttons'
          git push origin HEAD:main
